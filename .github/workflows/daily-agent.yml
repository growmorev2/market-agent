name: Daily Market Agent

on:
  schedule:
    # സമയം UTC-യിലാണ്. 12:43 UTC = വൈകിട്ട് 6:13 IST, തിങ്കൾ–വെള്ളി
    # (GM World 5:30 PM-ന് പുതുക്കിയ ശേഷം; NSE bhavcopy-യും ഈ സമയത്ത് വന്നിരിക്കും)
    - cron: "43 12 * * 1-5"
  workflow_dispatch: # Actions ടാബിൽ നിന്ന് കൈകൊണ്ട് ഓടിക്കാൻ
    inputs:
      mode:
        description: "full = മുഴുവൻ റിപ്പോർട്ട് (Telegram-ഉം) · strategy-only = Strategy പേജ് മാത്രം, ഒന്നും അയക്കില്ല"
        type: choice
        options: [full, strategy-only]
        default: full

permissions:
  contents: write # റിപ്പോർട്ടും ഹിസ്റ്ററിയും repo-യിൽ സേവ് ചെയ്യാൻ

concurrency:
  group: market-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # GM World-നായി 20 മിനിറ്റ് വരെ കാത്തിരിക്കാം
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # മുഴുവൻ ഹിസ്റ്ററി — സേവ് ചെയ്യുമ്പോൾ പ്രശ്നം വരാതിരിക്കാൻ

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium # PDF-ന്

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_SEARCH_MODEL: ${{ vars.GROQ_SEARCH_MODEL }}
          NEWS_SEARCH: ${{ vars.NEWS_SEARCH }}
          SITE_URL: ${{ vars.SITE_URL }}
          SEND_PDF: ${{ vars.SEND_PDF }}
          GMWORLD_URL: ${{ vars.GMWORLD_URL }}
          GMWORLD_WAIT_MIN: ${{ vars.GMWORLD_WAIT_MIN }}
          SCREENER_TOKEN: ${{ secrets.SCREENER_TOKEN }} # Value portfolio-ക്കുള്ള Fair Value (private screener-summery repo)
        run: |
          if [ "${{ inputs.mode }}" = "strategy-only" ]; then python agent.py --strategy-only; else python agent.py; fi

      - name: Save report and history
        if: always()
        run: |
          git config user.name "market-agent"
          git config user.email "market-agent@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then echo "സേവ് ചെയ്യാൻ മാറ്റങ്ങളില്ല"; exit 0; fi
          git commit -m "${{ inputs.mode == 'strategy-only' && 'Strategy' || 'Report' }} $(TZ=Asia/Kolkata date +%F)"
          # repo-യിൽ ഇതിനിടെ മാറ്റം വന്നാൽ (ഉദാ: നിങ്ങൾ ഫയൽ upload ചെയ്താൽ) ആദ്യം അത് എടുത്ത് വീണ്ടും ശ്രമിക്കും
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            echo "ശ്രമം $i പരാജയപ്പെട്ടു, വീണ്ടും…"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ALERT_SUBJECT: "⚠️ Market Agent (ദിവസ റിപ്പോർട്ട്) പരാജയപ്പെട്ടു"
          ALERT_MSG: |
            ⚠️ Market Agent (ദിവസ റിപ്പോർട്ട്) പരാജയപ്പെട്ടു
            Workflow: ${{ github.workflow }} (${{ github.event_name }})
            എവിടെ പിശക് എന്ന് കാണാൻ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/alert.py
