name: Test alert
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ALERT_SUBJECT: "✅ Test alert (${{ github.repository }})"
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, ".github")
          from alert import send
          sent = send("✅ Test alert (${{ github.repository }}) — Telegram + Email ശരിയായി സെറ്റ് ചെയ്തു. ഇതിന് മറുപടി വേണ്ട.", "✅ Test alert (${{ github.repository }})")
          print("SENT", sent)
          if len(sent) < 2:
              sys.exit("രണ്ടും (Telegram + Email) എത്തിയില്ല: " + str(sent))
          PY
